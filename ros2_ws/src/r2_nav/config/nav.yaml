# R2 navigation: how it moves on its own. Edit it in the web console (Navigation page) or by
# hand (~/.config/ros2d2/nav.yaml once saved from the console wins over this one).
safety_radius: 0.55     # m from the body centre: the droid keeps everything outside it
slow_from: 0.80         # m beyond the circle where it starts slowing down
max_speed: 0.35         # m/s (the Mega bridge caps at 0.4)
max_turn_deg: 15        # deg/s (the bridge caps at 0.6 rad/s = 34)
accel: 0.25             # m/s²: gentle for a 40 kg droid
turn_accel_deg: 20      # deg/s²
max_drive_power: 40     # Sabertooth units, like ShadowMD drivespeed (caps max_speed)
max_turn_power: 30      # Sabertooth units, like ShadowMD turnspeed
goal_tolerance: 0.25    # m
sensors_may_stop_earlier: true   # a sensor's own stop_distance (sensors.yaml) wins when larger
filter: true            # median of 5 + smoothing on the distance sensors
on_blocked: turn        # turn | reverse | wait
allow_reverse: true
give_up_after: 3        # tries; then it stops until it gets a new goal
safety_cone_deg: 60     # deg each side of ahead: something inside the circle there stops it
search_turn: 0.5        # Go forward, boxed in: turns on the spot at this fraction of max_turn_deg
search_free: 0.3        # m beyond the circle that must be free ahead to leave that way
search_wide_deg: 60     # deg: a way out further off to a side than this is searched for slowly
search_near: 0.1        # m beyond the circle: closer than this ahead counts as boxed in
forward_stuck_s: 8      # s without moving 0.15 m in Go forward: search for a way out
sounds:                 # MarcDuino command, or "" for none (examples: match your sound banks)
  auto_on: "S1:$11"
  obstacle: "S1:$21"
  blocked: "S1:$31"
  give_up: "S1:$41"
  arrived: "S1:$W"
