# Values tuned on the droid with the proof of concept (2026-10-23)
dome_tracker:
  ros__parameters:
    camera: front
    enabled: true
    rate_hz: 15.0
    min_speed: 18
    max_speed: 58
    kd: 0.3
    deadzone: 0.15
    invert: true
    lost_after: 0.2
    deg_per_s_at_80: 90.0      # 360 / seconds for a full turn at speed 80 (measure it)
    simulate: false
    camera_hfov_deg: 60.0
