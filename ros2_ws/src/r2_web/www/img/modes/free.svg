<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="Free roam: R2 strolls slowly round the whole room, changing course now and then, stopping to look round and to say hello to someone">
  <!-- ROS2D2, created by NandoMadrid (https://www.astromechspain.com/droides/r2-d2-nandomadrid/) · Astromech Spain (https://www.astromechspain.com) -->
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#1f2630" stroke-width="1"/></pattern>
    <g id="r2">
      <rect x="-7" y="-14" width="14" height="5" rx="1.5" fill="#202833" stroke="#8b949e"/>
      <rect x="-7" y="9" width="14" height="5" rx="1.5" fill="#202833" stroke="#8b949e"/>
      <circle r="9" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <path d="M10 0 L4 -4 L4 4 Z" fill="#e6edf3"/>
    </g>
    <g id="person"><circle r="7" fill="#6e7681" fill-opacity="0.5" stroke="#8b949e"/><circle r="3" fill="#8b949e"/></g>
  </defs>
  <rect width="320" height="180" rx="10" fill="#0d1117"/>
  <rect width="320" height="180" rx="10" fill="url(#g)"/>
  <!-- someone it stops to say hello to -->
  <use href="#person" x="252" y="66"/>
  <text x="262" y="52" fill="#d29922" font-family="system-ui, sans-serif" font-size="10">hello!</text>
  <path id="way" d="M40 120 C70 60 120 50 150 84 C178 116 214 96 232 76 C252 56 290 100 270 132 C250 160 150 160 110 140 C80 126 52 140 40 120 Z" fill="none" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.35"/>
  <use href="#r2">
    <!-- a stop to look round, then one by the person -->
    <animateMotion dur="16s" repeatCount="indefinite" rotate="auto" keyPoints="0;0.22;0.22;0.38;0.38;1" keyTimes="0;0.2;0.3;0.45;0.6;1" calcMode="linear">
      <mpath href="#way"/>
    </animateMotion>
  </use>
  <text x="12" y="20" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Free roam</text>
  <text x="12" y="168" fill="#8b949e" font-family="system-ui, sans-serif" font-size="10">strolls anywhere it can, stops to look and say hello</text>
</svg>
