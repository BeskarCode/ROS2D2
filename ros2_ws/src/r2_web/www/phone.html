<!doctype html>
<!-- ROS2D2, created by NandoMadrid (https://www.astromechspain.com/droides/r2-d2-nandomadrid/) · Astromech Spain (https://www.astromechspain.com) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ROS2D2 Phone</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ROS2D2">
<meta name="theme-color" content="#0d1117">
<link rel="apple-touch-icon" href="phone-icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="console.css">
<style>
  /* The phone view: the whole screen, no page scroll, thumbs first (tabs at the bottom). */
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: var(--fs) system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; overflow: hidden; -webkit-user-select: none; user-select: none;
         -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
  button { font: inherit; color: var(--text); }
  .ph-top { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex: none; }
  .ph-top img { height: 22px; } .ph-top img.ph-as { height: 28px; margin-right: -4px; }
  .ph-dots { display: flex; gap: 8px; font-size: var(--fs-s); color: var(--muted); flex: 1; min-width: 0; }
  .ph-dots span::before { content: '●'; margin-right: 4px; color: var(--muted); }
  .ph-dots span.ok::before { color: var(--green); } .ph-dots span.bad::before { color: var(--red); }
  .ph-stop { background: var(--red); border: none; border-radius: 10px; padding: 10px 18px; min-height: 48px; font-weight: 800;
             letter-spacing: .08em; color: #fff; display: inline-flex; gap: 8px; align-items: center; }
  .ph-stop:active { filter: brightness(1.25); }
  .ph-note { flex: none; margin: 8px 12px 0; padding: 8px 10px; border-radius: 8px; font-size: var(--fs-s); border: 1px solid var(--amber); color: var(--amber); }
  .ph-note[hidden] { display: none; }
  main { flex: 1; min-height: 0; overflow: auto; padding: 10px 12px; }
  .ph-tab[hidden] { display: none; }
  #tab-drive { height: 100%; }
  nav.ph-tabs { flex: none; display: flex; border-top: 1px solid var(--line); background: var(--panel); }
  nav.ph-tabs button { flex: 1; min-height: 56px; background: none; border: none; color: var(--muted); display: flex;
                       flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: var(--fs-s); }
  nav.ph-tabs button i { font-size: 20px; }
  nav.ph-tabs button.on { color: var(--blue); }
  nav.ph-tabs button[hidden] { display: none; }
  .ph-h { font-size: var(--fs-s); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 6px; }
  .ph-h:first-child { margin-top: 0; }
  .ph-muted { color: var(--muted); font-size: var(--fs-s); }

  /* Drive: two sticks, each with its Nav's buttons */
  .ph-drive { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; height: 100%; align-content: center; }
  .ph-nav { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .ph-nav h3 { margin: 0; font-size: var(--fs-s); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .ph-stick { width: min(42vw, 42vh, 190px); aspect-ratio: 1; border-radius: 50%; position: relative; touch-action: none;
              background: radial-gradient(#1c2128, #0f1318); border: 1px solid var(--line2); }
  .ph-knob { position: absolute; left: 50%; top: 50%; width: 34%; aspect-ratio: 1; margin: -17% 0 0 -17%; border-radius: 50%;
             background: radial-gradient(circle at 40% 35%, #4b5563, #1f2937); border: 1px solid #6b7280; pointer-events: none; }
  .ph-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .ph-b { min-width: 48px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line2); background: #21262d; font-weight: 700; touch-action: none; }
  .ph-b.down { background: var(--blue); border-color: var(--blue); }
  .ph-b.cross { color: #7aa2ff; } .ph-b.circle { color: #ff7b7b; }
  .ph-limit { grid-column: 1 / -1; text-align: center; }

  /* Actions and modes: big buttons */
  .ph-find { width: 100%; box-sizing: border-box; background: var(--panel); color: var(--text); border: 1px solid var(--line2);
             border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 16px; -webkit-user-select: text; user-select: text; }
  .ph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .ph-act { min-height: 64px; border-radius: 12px; border: 1px solid var(--line2); background: var(--panel); text-align: left;
            padding: 8px 10px; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; }
  .ph-act b { font-weight: 600; } .ph-act small { color: var(--muted); font-size: var(--fs-s); }
  .ph-act.fav { border-color: var(--amber); } .ph-act.fav b::before { content: '★ '; color: var(--amber); }
  .ph-act:disabled { opacity: .45; }
  .ph-act.sent { border-color: var(--green); background: rgba(63,185,80,.15); }
  .ph-act.on { border-color: var(--green); background: rgba(63,185,80,.15); }
  .ph-act.on small::after { content: ' · on'; color: var(--green); font-weight: 700; }
  .ph-stat { min-height: 1.3em; margin: 8px 0 0; }
  body.ph-other .ph-drive, body.ph-other .ph-grid { opacity: .45; pointer-events: none; }
  .ph-dots { overflow: hidden; white-space: nowrap; }
  .ph-stop { flex: none; }
  @media (max-width: 420px) { .ph-top img { height: 18px; } .ph-top img.ph-as { height: 24px; } .ph-stop { padding: 10px 14px; } }
  /* landscape (a short screen): each stick at its edge of the screen, its buttons in a column inside */
  @media (max-height: 500px) {
    .ph-top { padding: 4px 12px; } .ph-stop { min-height: 40px; padding: 6px 16px; }
    nav.ph-tabs button { min-height: 44px; flex-direction: row; gap: 8px; } nav.ph-tabs button i { font-size: 16px; }
    main { padding: 6px 12px; }
    .ph-drive { grid-template-columns: 1fr auto 1fr; }
    .ph-limit { grid-column: 2; grid-row: 1; align-self: center; max-width: 9em; }
    .ph-nav { flex-direction: row; gap: 12px; }
    .ph-nav[data-pad="D"] { flex-direction: row-reverse; grid-column: 3; justify-self: end; }
    .ph-nav h3 { display: none; }
    .ph-btns { flex-direction: column; flex-wrap: wrap; max-height: min(64vh, 260px); align-content: center; }
    .ph-stick { width: min(58vh, 32vw, 230px); }
  }
</style>
</head>
<body>
  <header class="ph-top">
    <img src="favicon.png" alt="Astromech Spain" class="ph-as"><img src="ros2d2-logo.png" alt="ROS2D2">
    <div class="ph-dots"><span id="ph-ros">ROS</span><span id="ph-mega">Mega</span></div>
    <button class="ph-stop" id="ph-stop" type="button" title="Let everything go and switch the mode and face tracking off"><i class="fa-solid fa-hand"></i>STOP</button>
  </header>
  <p class="ph-note" id="ph-other" hidden><i class="fa-solid fa-display"></i> Another device is driving R2. This phone takes over when it has been quiet for a second.</p>
  <p class="ph-note" id="ph-nomega" hidden></p>

  <main>
    <section class="ph-tab" id="tab-drive">
      <div class="ph-drive">
        <div class="ph-nav" data-pad="F"><h3>Foot</h3><div class="ph-stick" data-pad="F"><div class="ph-knob"></div></div>
          <div class="ph-btns"></div></div>
        <div class="ph-nav" data-pad="D"><h3>Dome</h3><div class="ph-stick" data-pad="D"><div class="ph-knob"></div></div>
          <div class="ph-btns"></div></div>
        <p class="ph-limit ph-muted" id="ph-limit"></p>
      </div>
    </section>
    <section class="ph-tab" id="tab-actions" hidden>
      <input class="ph-find" id="ph-find" type="search" placeholder="Find: holo, song, panel…" aria-label="Find an action">
      <div class="ph-h" id="ph-favh" hidden>Favourites</div>
      <div class="ph-grid" id="ph-favs"></div>
      <div class="ph-h">All actions <span class="ph-muted" style="text-transform:none;letter-spacing:0;font-weight:400">· hold one to make it a favourite</span></div>
      <div class="ph-grid" id="ph-acts"></div>
      <p class="ph-stat ph-muted" id="ph-astat"></p>
    </section>
    <section class="ph-tab" id="tab-modes" hidden>
      <div class="ph-grid" id="ph-modes"></div>
      <p class="ph-stat ph-muted" id="ph-mstat">A mode starts as with the controller: pressing its combination. Touching a stick or STOP switches it off.</p>
    </section>
  </main>

  <nav class="ph-tabs">
    <button type="button" data-tab="drive" class="on"><i class="fa-solid fa-gamepad"></i>Drive</button>
    <button type="button" data-tab="actions"><i class="fa-solid fa-bolt"></i>Actions</button>
    <button type="button" data-tab="modes"><i class="fa-solid fa-robot"></i>Modes</button>
  </nav>
  <script type="module" src="phone.js"></script>
</body>
</html>
