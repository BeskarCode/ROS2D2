# One block per camera. The launch file starts one camera node per block,
# named after the key: /cameras/<name>/image_raw
#
# source:  /dev/video0, a stable path from `ls /dev/v4l/by-id/`
#          (recommended with more than one USB camera: numbers can swap on reboot)
#          or a network URL, e.g. http://192.168.68.150:81/stream for an ESP32-CAM.

front:
  source: /dev/video0
  width: 640
  height: 480
  fps: 30
  fourcc: MJPG
  frame_id: dome_camera_front
  rotate: 0
  flip: none

# rear:
#   source: http://192.168.68.150:81/stream
#   frame_id: dome_camera_rear
