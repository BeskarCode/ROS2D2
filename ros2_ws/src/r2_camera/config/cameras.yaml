# The cameras R2 looks through. The web console's camera setup (the gear in the header)
# saves its own copy in ~/.config/ros2d2/cameras.yaml, which then wins over this file.
#
# auto: every USB camera plugged in becomes cam1, cam2... by USB port (same port = same
# number), spread evenly from left to right over spread_deg.
auto:
  hfov_deg: 60        # horizontal field of view of each camera
  spread_deg: 60      # two cameras: -30 and +30 degrees from the dome's front
  width: 640
  height: 480
  fps: 30
  fourcc: MJPG

# Or name them one by one (then remove `auto`):
#
# cam1:
#   source: /dev/v4l/by-id/usb-...-video-index0   # stable name: `ls /dev/v4l/by-id/`
#   yaw_deg: -30      # where it points: degrees from the dome's front, + = right
#   hfov_deg: 60
#   width: 640
#   height: 480
#   fps: 30
#   fourcc: MJPG
#   rotate: 0         # 0, 90, 180, 270
#   flip: none        # none, h, v, both
# cam2:
#   source: http://192.168.68.150:81/stream       # e.g. an ESP32 camera
#   yaw_deg: 180
